<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendita Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-deep: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-input: #F1F5F9;
            --text-main: #0F172A;
            --text-dim: #64748B;
            --accent-blue: #3B82F6;
            --accent-blue-hover: #2563EB;
            --accent-amber: #D97706;
            --border: #E2E8F0;
            --ff-tech: 'JetBrains Mono', monospace;
            --ff-head: 'Syne', sans-serif;
        }

        body.dark-mode {
            --bg-deep: #050609;
            --bg-card: #0A0C12;
            --bg-input: #11141D;
            --text-main: #E2E8F0;
            --text-dim: #94A3B8;
            --accent-amber: #F59E0B;
            --border: #1E293B;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--ff-tech);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            transition: background 0.4s ease, color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body:not(.dark-mode) img { filter: invert(0); }
        body.dark-mode img { filter: invert(1) brightness(1.8); }

        #app { width: 100%; display: flex; min-height: 100vh; }

        /* --- ADMIN PANELS SYSTEM --- */
        .admin-container { display: flex; width: 100%; min-height: 100vh; }
        
        .sidebar { 
            width: 280px; 
            background: var(--bg-card); 
            border-right: 1px solid var(--border); 
            padding: 1.5rem; 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem;
            overflow-y: auto;
        }

        .workspace { 
            flex: 1; 
            padding: 2rem; 
            overflow-y: auto; 
            background: var(--bg-deep);
        }

        /* --- NAVIGATION TREE --- */
        .tree-section { display: flex; flex-direction: column; gap: 0.5rem; }
        .tree-title { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
        
        .tree-item { 
            padding: 10px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            gap: 8px;
            background: transparent;
            transition: 0.2s;
        }
        .tree-item:hover { background: var(--bg-input); color: var(--accent-blue); }
        .tree-item.active { background: var(--accent-blue); color: #fff; }

        /* --- CARDS & GRIDS --- */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 11fr)); gap: 1rem; margin-top: 1.5rem; }
        
        .grid-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 1.2rem; 
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .grid-box:hover { border-color: var(--accent-blue); transform: translateY(-2px); }

        /* --- LOGIN WRAPPER --- */
        .login-wrapper { display: flex; width: 100%; justify-content: center; align-items: center; padding: 16px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2.2rem 1.5rem; width: 100%; max-width: 380px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04); border-top: 4px solid var(--accent-blue); }

        h1, h2, h3 { font-family: var(--ff-head); text-transform: uppercase; letter-spacing: -0.5px; margin: 0; }
        h1 { font-size: 26px; font-weight: 800; }
        h2 { font-size: 18px; font-weight: 700; }
        h3 { font-size: 13px; font-weight: 700; color: var(--text-dim); }

        input, .btn { font-family: var(--ff-tech); font-size: 14px; border-radius: 10px; outline: none; transition: 0.2s; }
        input { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); width: 100%; padding: 14px 16px; appearance: none; -webkit-appearance: none; }
        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12); }

        .btn { border: none; cursor: pointer; padding: 12px 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: var(--accent-blue); color: #fff; }
        .btn-full { width: 100%; padding: 14px; }

        .theme-toggle { position: fixed; top: 16px; right: 16px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); cursor: pointer; padding: 10px; border-radius: 50%; font-size: 16px; z-index: 100; }

        .row { display: flex; flex-direction: row; align-items: center; }
        .col { display: flex; flex-direction: column; }
        
        #loader { display: none; flex-direction: column; align-items: center; gap: 1.5rem; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .pulse { animation: pulse-animation 1.5s infinite ease-in-out; }
        @keyframes pulse-animation { 0% { transform: scale(0.98); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.98); opacity: 0.7; } }

        /* Mobile Breakpoint rules */
        @media (max-width: 768px) {
            .admin-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeBtn">🌓</button>
    <div id="loader">
        <img src="logo.png" class="pulse" style="width: 80px;">
        <p style="font-size: 9px; letter-spacing: 3px; color: var(--accent-blue); font-weight: 700;">NEXUS NETWORK INITIALIZATION...</p>
    </div>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
